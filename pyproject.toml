[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bugbash-autopilot"
version = "0.2.0"
description = "Evidence-first tooling for document-driven autonomous web application testing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "tmdaidevs" }
]
dependencies = [
  "Pillow>=10.0"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0"
]
jev = [
  "jev-ultrafast @ git+https://github.com/browser-use/jev-ultrafast.git@1231850a0bf1a0c0341fe408ef1668dbbfdfac46"
]

[project.scripts]
bugbash-autopilot = "bugbash_autopilot.cli:main"

[project.urls]
Homepage = "https://github.com/tmdaidevs/autonomous-testing-agent"
Issues = "https://github.com/tmdaidevs/autonomous-testing-agent/issues"

[tool.setuptools]
package-dir = { "" = "skills/bugbash-autopilot/scripts" }
packages = ["bugbash_autopilot"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["bugbash_autopilot"]

[tool.coverage.report]
show_missing = true
skip_covered = true
